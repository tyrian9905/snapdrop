name = "snapdrop"
main = "worker.js"
compatibility_date = "2026-08-04"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "SnapdropRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SnapdropRoom"]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
