name = "snapdrop"                    # 建议改为 "snapdrop" 以匹配 CI 系统期望（避免警告）
main = "worker.js"
compatibility_date = "2026-08-04"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "SnapdropRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SnapdropRoom"]   # 使用 SQLite 存储后端

[assets]
directory = "./public"
binding = "ASSETS"
